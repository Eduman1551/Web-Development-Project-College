<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WashThoseClothes.IIITK</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extra.css">
</head>
<body>
  <nav>
    <a href="index.html" class="brand">
      <img src="images/logo.svg" alt="WashThoseClothes.IIITK logo">
      <span>WashThoseClothes.IIITK</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="students.html">Students</a>
      <a href="machines.html">Machines</a>
      <a href="bookings.html">Bookings</a>
      <span id="authLinks"></span>
    </div>
  </nav>

  <div class="container center">
    <div class="card auth-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Login with your roll no to book a washing machine.</p>
      <form id="loginForm">
        <label>Roll No</label>
        <input type="text" id="rollNo" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
      </form>
      <p id="message"></p>
      <p class="switch">New student? <a href="register.html">Register here</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  <script src="js/animate.js"></script>
</body>
</html>
