<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machines - Laundry Booking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extra.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="students.html">Students</a>
    <a href="machines.html">Machines</a>
    <a href="bookings.html">Bookings</a>
    <a href="login.html" id="adminLink">Admin Login</a>
  </nav>

  <div class="container">
    <h1>Machines</h1>

    <div class="card" id="formCard" hidden>
      <h2 id="formTitle">Add Machine</h2>
      <p id="message"></p>
      <form id="machineForm">
        <input type="hidden" id="machineId">

        <label>Machine Name</label>
        <input type="text" id="name" required>

        <label>Floor</label>
        <input type="number" id="floor" required>

        <label>Status</label>
        <select id="status">
          <option value="working">Working</option>
          <option value="repair">Repair</option>
        </select>

        <button type="submit" id="saveBtn">Add Machine</button>
        <button type="button" id="cancelBtn" class="red" hidden>Cancel</button>
      </form>
    </div>

    <div class="card">
      <img src="images/washing-machine.jpg" alt="Row of washing machines in the hostel laundry room" class="machine-img">
      <h2>All Machines</h2>
      <table>
        <tr>
          <th>Name</th>
          <th>Floor</th>
          <th>Status</th>
          <th id="actionsHeader" hidden>Actions</th>
        </tr>
        <tbody id="machineTable"></tbody>
      </table>
    </div>
  </div>

  <script src="js/machines.js"></script>
</body>
</html>
