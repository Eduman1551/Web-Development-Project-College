<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - WashThoseClothes.IIITK</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extra.css">
</head>
<body>
  <nav>
    <a href="index.html" class="brand">
      <img src="images/logo.svg" alt="WashThoseClothes.IIITK logo">
      <span>WashThoseClothes.IIITK</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="students.html" class="active">Students</a>
      <a href="machines.html">Machines</a>
      <a href="bookings.html">Bookings</a>
      <span id="authLinks"></span>
    </div>
  </nav>

  <div class="container">
    <h1>Students</h1>
    <p class="intro">Everyone who uses the hostel laundry. You can edit or delete only your own details.</p>
    <p id="message"></p>

    <div class="card" id="formCard" hidden>
      <h2>Edit My Details</h2>
      <p class="subtitle">Update your name, room or phone number.</p>
      <form id="studentForm">
        <input type="hidden" id="studentId">

        <label>Name</label>
        <input type="text" id="name" required>

        <label>Roll No</label>
        <input type="text" id="rollNo" required>

        <label>Room No</label>
        <input type="text" id="roomNo" required>

        <label>Phone</label>
        <input type="text" id="phone">

        <button type="submit">Update</button>
        <button type="button" id="cancelBtn" class="secondary">Cancel</button>
      </form>
    </div>

    <div class="card">
      <h2>All Students</h2>
      <table>
        <tr>
          <th>Name</th>
          <th>Roll No</th>
          <th>Room No</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
        <tbody id="studentTable"></tbody>
      </table>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/students.js"></script>
  <script src="js/animate.js"></script>
</body>
</html>
